  <rect x="350" y="322" width="300" height="88" rx="12" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/>
  <rect x="366" y="338" width="240" height="9" rx="4" fill="#dfe4ec"/>
  <rect x="366" y="356" width="260" height="9" rx="4" fill="#e9edf3"/>
  <rect x="366" y="374" width="200" height="9" rx="4" fill="#e9edf3"/>

