  <rect x="370" y="560" width="300" height="9" rx="4" fill="#dfe4ec"/>
  <rect x="370" y="590" width="40" height="14" rx="7" fill="#eef1f6"/>
  <circle cx="1104" cy="599" r="14" fill="url(#accent)"/>
  <path d="M1100 599h8M1104 595v8" stroke="#ffffff" stroke-width="1.4"/>

  <text x="1130" y="654" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#6f7683">示意图（非实际截图）· schematic illustration, not a screenshot</text>
